name: keep-backend-warm

# Superseded 25 Sep 2026: GitHub ran this "every 10 minutes" schedule only every few
# hours, so the backend still slept. The site's Vercel Cron (/api/keep-warm in
# alleyne-real-estate) now keeps it awake. Kept as a manual fallback only.

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://alleyne-backend.onrender.com/_health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "$URL" || echo "000")
            echo "ping $i -> $code"
            if [ "$i" -lt 6 ]; then sleep 60; fi
          done
