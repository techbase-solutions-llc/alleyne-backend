services:
  - type: web
    name: alleyne-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_URL
        sync: false
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_HOST
        fromDatabase:
          name: alleyne-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: alleyne-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: alleyne-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: alleyne-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: alleyne-db
          property: password
      - key: DATABASE_SSL
        value: "true"
      # Media library uploads (Vercel Blob store alleyne-listing-photos). Set by hand.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false

databases:
  - name: alleyne-db
    databaseName: alleyne
    plan: free
    region: oregon
